name: CI
on:
  pull_request:
  push:
    branches: [main, feat/consumer-document-mvp]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm --filter @lexilens/database db:validate
      - run: corepack pnpm security:policy:test
      - name: Dependency security release policy
        run: corepack pnpm security:audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
  image-security-release-gate:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final runtime images
        run: docker build --pull --tag lexilens-api:ci apps/api && docker build --pull --tag lexilens-web:ci apps/web
      - name: Require an installed image scanner and block high or critical findings
        run: |
          if ! command -v docker >/dev/null || ! docker scout version >/dev/null 2>&1; then
            echo 'A pinned, approved image scanner must be installed in the release runner; refusing release.' >&2
            exit 1
          fi
          docker scout cves --only-severity high,critical --exit-code lexilens-api:ci
          docker scout cves --only-severity high,critical --exit-code lexilens-web:ci
