# Local development convenience only. This is not a production deployment definition.
name: lexilens-local
services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: lexilens
      POSTGRES_USER: lexilens
      POSTGRES_PASSWORD: local-dev-only-change-me
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lexilens -d lexilens']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local-minio
      MINIO_ROOT_PASSWORD: local-minio-change-me
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 local-minio local-minio-change-me && mc mb --ignore-existing local/lexilens-quarantine"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    profiles: ['migrate']
    environment:
      DATABASE_URL: postgresql://lexilens:local-dev-only-change-me@postgres:5432/lexilens?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ['pnpm', '--filter', '@lexilens/database', 'db:migrate']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: '4000'
      CORS_ORIGIN: http://localhost:3000
      PERSISTENCE_MODE: postgresql
      DATABASE_URL: postgresql://lexilens:local-dev-only-change-me@postgres:5432/lexilens?schema=public
      STORAGE_MODE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: lexilens-quarantine
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: local-minio
      S3_SECRET_ACCESS_KEY: local-minio-change-me
      SCANNER_MODE: magic
      AUTH_MODE: oidc
      OIDC_ISSUER_URL: https://issuer.example.invalid/
      OIDC_JWKS_URI: https://issuer.example.invalid/.well-known/jwks.json
      OIDC_AUDIENCE: https://api.example.invalid
      OCR_MODE: disabled
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # These .invalid values make the production image build safe; replace only in an approved environment.
      args:
        NEXT_PUBLIC_API_URL: https://api.example.invalid
        NEXT_PUBLIC_AUTH_MODE: oidc
        NEXT_PUBLIC_OIDC_ISSUER: https://issuer.example.invalid/
        NEXT_PUBLIC_OIDC_CLIENT_ID: replace-with-approved-public-spa-client-id
        NEXT_PUBLIC_OIDC_REDIRECT_URI: https://app.example.invalid/auth/callback
        NEXT_PUBLIC_OIDC_POST_LOGOUT_URI: https://app.example.invalid/
        NEXT_PUBLIC_OIDC_AUDIENCE: https://api.example.invalid
        NEXT_PUBLIC_OIDC_SCOPE: openid profile documents:read documents:write
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
